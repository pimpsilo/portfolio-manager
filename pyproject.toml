[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Deterministic Portfolio Manager (PM) Engine connecting tradingagents evaluations with capital allocation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
agents = [
    "tradingagents",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
