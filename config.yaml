paths:
  reports_dir: "/Users/matthewhope/github_projects/portfolio-manager/portfolio/01_agent_reports"
  downloads_dir: "/Users/matthewhope/Downloads"
  obsidian_vault_dir: "/Users/matthewhope/github_projects/portfolio-manager/portfolio/00_trade_orders"

signals:
  max_age_days: 14               # Reports older than 14 days are expired
  stale_warning_days: 4          # Alert if report expires in <= 4 days (i.e. age >= 10 days)
  candidate_min_signal: "OVERWEIGHT"
  restrict_candidates_to_watchlist: true # Enforce that only tickers in stocks.csv or holdings enter investable universe
  excluded_tickers: []           # Explicit blacklist of tickers that will never enter the universe or receive capital

# Equivalent share classes (e.g. Alphabet Class C and Class A)
# If one is already held in the portfolio, the other is merged to prevent double allocation.
equivalent_symbols:
  - ["GOOG", "GOOGL"]
  - ["FOX", "FOXA"]
  - ["BRK.A", "BRK.B"]

risk:
  max_position_weight: 0.15      # Max 15% single position
  min_cash_reserve: 0.15         # Min 15% cash reserve floor ("Dry Powder")
  enforce_cash_reserve_on_buys: true # Never allow total buys to draw down cash below min_cash_reserve
  max_cluster_exposure: 0.25     # Max 25% exposure per correlated cluster
  clustering_cophenetic_threshold: 0.5
  history_lookback_days: 180

# Option 5: Market-Cap / Maturity Anchor with Active Tilts
market_cap_weighting:
  enabled: true
  mega_cap_threshold: 200000000000    # $200B
  large_cap_threshold: 50000000000     # $50B
  tier_multipliers:
    mega_cap: 3.0                      # Mega-cap anchor (e.g. META, AMZN, GOOG, NVDA, MSFT)
    large_cap: 1.8                     # Large-cap core (e.g. SPGI, MCO, INTU, BKNG, UBER)
    mid_cap: 1.0                       # Mid/Emerging satellite (e.g. HIG, EG, WDC, ALAB)

multipliers:
  OVERWEIGHT: 1.5
  EQUAL_WEIGHT: 1.0
  UNDERWEIGHT: 0.5
  AVOID: 0.0

rebalance:
  drift_mode: "relative"         # Option B: relative position drift
  relative_threshold: 0.20       # 20% deviation from target position size
  hold_drift_tolerance: 1.00     # Let equal-weight holds float up to 100% above target before trimming
  min_dollar_trade: 1500.0       # Minimum trade floor
  prefer_whole_shares: true      # Round standard orders to whole integer shares
  liquidate_avoid: true          # Always fully liquidate 100% on AVOID signals

  # Transaction Stepping & Staged Execution Controls
  stepping:
    enabled: true
    starter_step_factor: 0.50     # 50% tranche for new candidate starter entries
    rebalance_step_factor: 0.50   # 50% tranche for rebalance buys and trims
    max_trade_dollar_cap: 6000.0  # Max dollar trade per order ($6,000 ceiling guard)
    avoid_step_factor: 1.00       # 100% immediate liquidation on AVOID signals

watcher:
  poll_interval_seconds: 3       # Check Downloads folder every 3 seconds
  debounce_seconds: 2            # Wait after file write finishes before running solver

# ==============================================================================
# Watchlist Configuration for TradingAgents Research Pipeline
# ==============================================================================
watchlist:
  auto_triage: true                  # Automatically scan for missing/stale reports
  stocks_file: "stocks.csv"          # Primary equities list file (47 securities)
  max_batch_size: 5                  # Max tickers to evaluate in a single batch
  rate_limit_delay_seconds: 5.0      # Pause between ticker agent runs (5.0s per Gemini batch)
  # Categories can be used to define additional security groups if desired in the future.
  categories: {}

# ==============================================================================
# TradingAgents Agent Engine Configuration
# ==============================================================================
tradingagents:
  llm_provider: "google"             # Google Gemini
  quick_think_llm: "gemini-3.1-flash-lite"
  deep_think_llm: "gemini-3.5-flash"
  google_thinking_level: "high"
  max_debate_rounds: 5               # "Deep" research depth (5 debate rounds)
  max_risk_discuss_rounds: 5         # "Deep" research depth (5 risk rounds)
  checkpoint_enabled: false

# ==============================================================================
# Obsidian Markdown Output Configuration
# ==============================================================================
output:
  report_link_style: "markdown"    # "markdown" | "wikilink" | "none"
  prefer_complete_report: true     # link complete_report.md over decision.md
  date_layout: "stacked"           # "stacked" (with <br>) | "inline"
  append_daily_snapshots: true     # append intra-day runs to Trade_Orders_YYYY-MM-DD.md


